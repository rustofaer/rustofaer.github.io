<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Бинго киностримов (Deluxe Edition)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500;1,600;1,700&family=PT+Serif:ital,wght@0,400;1,400;1,700&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#181B1A;          --bg-pattern:url("img/bg-pattern.webp");
  --line:#0B0B0B;
  --tile:#DDE3EC;
  --tile-hover:#CED6E3;
  --coral:#F79E79;
  --mark:#D9482A;
  --mark-deep:#A8341B;
  --gold:#FFD24A;
  --cell-ink:#131318;      /* текст внутри светлых клеток */
  --ink:#EDEBE6;           /* текст поверх тёмного фона */
  --ink-soft:#9A97A2;
  --rule:rgba(237,235,230,.24);
  --focus:#8FB0FF;
  --bg-size:560px auto;
}

*{box-sizing:border-box}
html,body{margin:0}
body{
  background-color:var(--desk);
  background-image:var(--bg-pattern,none);
  background-repeat:repeat;
  background-size:var(--bg-size,auto);
  background-attachment:fixed;
  min-height:100dvh;
  color:var(--ink);
  font-family:'PT Serif',Georgia,'Times New Roman',serif;
  font-size:15px;line-height:1.45;
  -webkit-text-size-adjust:100%;
  padding:clamp(10px,2.6vw,26px);
  display:flex;justify-content:center;
}
main{width:100%;max-width:660px;display:flex;flex-direction:column;gap:clamp(10px,2.2vw,16px)}

button{font:inherit;color:inherit;cursor:pointer}
:where(button,a):focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}

.tools{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.head-block{display:flex;flex-direction:column;gap:clamp(10px,2.2vw,16px)}
.tool{
  background:transparent;border:1px solid var(--rule);border-radius:0;
  width:38px;height:38px;padding:0;
  display:grid;place-items:center;
  color:var(--ink);
  transition:background .14s ease,border-color .14s ease,color .14s ease;
}
.tool svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tool[aria-pressed="false"]{color:var(--ink-soft)}

/* ---- карточка: чёрный фон просвечивает сквозь зазоры и работает сеткой ---- */
.card{background:var(--line);padding:3px;display:flex;flex-direction:column;gap:3px;
  box-shadow:0 22px 50px -22px rgba(0,0,0,.75)}

.pagetitle{
  margin:0;
  text-align:center;
  color:var(--ink);
  font-family:'Playfair Display','PT Serif',Georgia,serif;
  font-style:italic;font-weight:600;
  font-size:clamp(23px,5.6vw,42px);
  line-height:1.12;letter-spacing:-.01em;
  text-shadow:0 2px 14px rgba(0,0,0,.55);
}
.pagetitle small{display:block;font-size:.55em;font-weight:500;color:var(--ink-soft);margin-top:.25em}

.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.cell{
  aspect-ratio:1;
  background:var(--tile);
  color:var(--cell-ink);
  border:0;border-radius:0;
  padding:clamp(4px,1.3vw,10px);
  display:flex;align-items:center;justify-content:center;text-align:center;
  font-family:'PT Serif',Georgia,serif;font-style:italic;
  font-size:clamp(9px,2.35vw,15px);
  line-height:1.22;
  overflow:hidden;hyphens:auto;
  transition:background .14s ease,color .14s ease,transform .12s ease;
}
.cell:hover:not(.on){background:var(--tile-hover)}
.cell:active{transform:scale(.95)}

.cell.on{background:var(--mark);color:#FFF6F2;font-weight:700;box-shadow:inset 0 0 0 3px var(--mark-deep)}
.cell.free{background:var(--gold);color:#0B0B0B;font-size:clamp(22px,7vw,44px);cursor:default;font-style:normal;padding:0;overflow:hidden}
.cell.free img{width:100%;height:100%;object-fit:cover;display:block}
.cell.win{
  background:var(--gold);color:#0B0B0B;font-weight:700;box-shadow:inset 0 0 0 3px #0B0B0B;
  animation:pop .45s cubic-bezier(.2,1.6,.4,1) backwards;animation-delay:var(--d,0ms);
}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.1)}100%{transform:scale(1)}}

.footer{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;min-height:32px}
.hint{margin:0;color:var(--ink-soft);font-size:13.5px;font-style:italic}
.banner{
  margin:0;font-family:'Playfair Display','PT Serif',Georgia,serif;font-style:italic;font-weight:700;
  font-size:clamp(16px,3.8vw,22px);color:var(--mark);
}
.seed{font-size:12.5px;color:var(--ink-soft);border:1px solid var(--rule);padding:3px 10px;white-space:nowrap}

#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}
.toast{
  position:fixed;left:50%;bottom:24px;transform:translate(-50%,14px);
  background:#F5F3EE;color:#131318;padding:9px 16px;font-size:13.5px;
  opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;z-index:10;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>
<body>

<main>
  <div class="head-block">
    <h1 class="pagetitle">Бинго киностримов <small>(Deluxe Edition)</small></h1>

    <div class="tools">
      <button class="tool" id="sound" aria-pressed="true" aria-label="Звук" title="Звук"></button>
      <button class="tool" id="share" aria-label="Скопировать ссылку" title="Скопировать ссылку">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      </button>
      <button class="tool" id="reset" aria-label="Снять все отметки" title="Снять все отметки">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 21-4.3-4.3a2.4 2.4 0 0 1 0-3.4l9.6-9.6a2.4 2.4 0 0 1 3.4 0l5.6 5.6a2.4 2.4 0 0 1 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
      </button>
      <button class="tool" id="new" aria-label="Новая карточка" title="Новая карточка">
        <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="22 4 22 10 16 10"/><path d="M20.5 15a9 9 0 1 1-2.1-9.4L22 10"/></svg>
      </button>
    </div>
  </div>

  <section class="card">
    <div class="grid" id="grid" role="group" aria-label="Игровое поле 5 на 5"></div>
  </section>

  <div class="footer">
    <p class="hint" id="status">Отмечай, что уже случилось. Пять в ряд — бинго.</p>
    <span class="seed" id="seedChip"></span>
  </div>
</main>

<canvas id="confetti" aria-hidden="true"></canvas>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------------- 1. Набор карточек ---------------- */
const CARDS = [
  "погоня века","смена сцены в обс, чтобы стрим не забанили","Юля пародирует звуки/героев фильма",
  "чеховское ружьё","кулстори по мотивам фильма","асмр","сон собаки",
  "Юля спойлерит","добрый милый (мульт)фильм","квадратная попа от бесконечного кино",
  "«это конец? а, нет»","русский дубляж","финальный боссфайт","кринжовая эротика",
  "собственный саундтрек к фильму от Юли","романтичная концовка","мюзикл",
  "ничего не понятно, но очень интересно","да не умер он в конце!",
  "операторская работа и монтаж — блевотрон 3000","«это звук в фильме или у меня?»",
  "фоновый хрум-хрум","слооооуууу моооооо","бэксит фильма в чате","он избранный!",
  "да она не может любить меня! да я люблю тебя!","Юля смотрела фильм",
  "подростковая драма","Юля подпевает песне в фильме","основано на реальных событиях",
  "че пацаны аниме?","поиски нужного тайминга сабов","Юля плачет, чат плачет, все плачут",
  "оркестр фигачит","магазин или обойма?! обсуждение оружейных нюансов","бан от Игоря",
  "вот это поворот!","бу!","а о чём фильм то в итоге?","все умерли","фоновые ноготочки",
  "диалоги от Тарантино","вздохи сочувствия","долбит нормально, Юлю не слышно",
  "чат устал закрывать глаза","бесконечные патроны, бесконечный аттракцион",
  "ты как смирительную рубашку снял?!","нуарный нуар"
];

const FREE_CELL = true;
const FREE_INDEX = 12;

/* Картинки для центральной клетки. Одна выбирается случайно — так же,
   как фразы, и так же детерминированно по сиду.
   Чтобы добавить свою: положи файл рядом и впиши путь, либо data:URI. */
const FREE_IMAGES = [
  "img/klown.webp"
];

/* ---------------- 2. Детерминированная генерация ---------------- */
function hashSeed(str){
  let h=1779033703^str.length;
  for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19;}
  return ()=>(h=Math.imul(h^h>>>16,2246822507),h=Math.imul(h^h>>>13,3266489909),(h^=h>>>16)>>>0);
}
function mulberry32(a){
  return function(){
    a|=0;a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
function shuffled(arr,rnd){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

const LINES=(()=>{
  const L=[];
  for(let r=0;r<5;r++) L.push([0,1,2,3,4].map(c=>r*5+c));
  for(let c=0;c<5;c++) L.push([0,1,2,3,4].map(r=>r*5+c));
  L.push([0,6,12,18,24]); L.push([4,8,12,16,20]);
  return L;
})();

/* ---------------- 3. Состояние ---------------- */
const store={
  get(k){try{return localStorage.getItem(k);}catch(e){return null;}},
  set(k,v){try{localStorage.setItem(k,v);}catch(e){}}
};

const url=new URL(location.href);
let seed=url.searchParams.get("seed");
if(!seed){
  seed=Math.random().toString(36).slice(2,8);
  url.searchParams.set("seed",seed);
  history.replaceState(null,"",url);
}

const rnd=mulberry32(hashSeed(seed)());
const picked=shuffled(CARDS,rnd).slice(0,FREE_CELL?24:25);
const board=[];
for(let i=0;i<25;i++){
  if(FREE_CELL&&i===FREE_INDEX) board.push(null);
  else board.push(picked.shift());
}

const KEY="bingo-kino:"+seed;
let marked=new Set();
try{
  const saved=JSON.parse(store.get(KEY)||"[]");
  if(Array.isArray(saved)) saved.forEach(i=>marked.add(i));
}catch(e){}
if(FREE_CELL) marked.add(FREE_INDEX);

let soundOn=store.get("bingo:sound")!=="off";
let wonLines=0;

/* ---------------- 4. Отрисовка ---------------- */
const grid=document.getElementById("grid");
const cells=board.map((text,i)=>{
  const isFree=FREE_CELL&&i===FREE_INDEX;
  const b=document.createElement("button");
  b.className="cell"+(isFree?" free":"");
  b.setAttribute("aria-pressed","false");
  if(isFree){
    b.setAttribute("aria-label","Свободная клетка");
    b.disabled=true;
    if(FREE_IMAGES.length){
      const img=document.createElement("img");
      img.src=FREE_IMAGES[Math.floor(rnd()*FREE_IMAGES.length)];
      img.alt="";
      img.loading="lazy";
      b.appendChild(img);
    }else{
      b.textContent="👑";
    }
  }else{
    b.textContent=text;
    b.addEventListener("click",()=>toggle(i));
  }
  grid.appendChild(b);
  return b;
});

function winningCells(){
  const set=new Set(); let count=0;
  for(const line of LINES){
    if(line.every(i=>marked.has(i))){count++;line.forEach(i=>set.add(i));}
  }
  return {set,count};
}

function render(animateWin){
  const {set,count}=winningCells();
  cells.forEach((el,i)=>{
    const on=marked.has(i);
    el.classList.toggle("on",on&&!(FREE_CELL&&i===FREE_INDEX));
    el.classList.toggle("win",set.has(i));
    el.setAttribute("aria-pressed",String(on));
    if(animateWin&&set.has(i)) el.style.setProperty("--d",(i%5)*55+"ms");
  });

  const status=document.getElementById("status");
  if(count>0){
    status.className="banner";
    status.textContent=count===1?"Бинго! Линия закрыта.":"Бинго! Линий: "+count+".";
  }else{
    status.className="hint";
    status.textContent="Отмечай, что уже случилось. Пять в ряд — бинго.";
  }

  if(count>wonLines&&animateWin) celebrate();
  wonLines=count;
}

function toggle(i){
  marked.has(i)?marked.delete(i):marked.add(i);
  store.set(KEY,JSON.stringify([...marked]));
  render(true);
}

/* ---------------- 5. Победа ---------------- */
let audioCtx=null;
function playWin(){
  if(!soundOn) return;
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) return;
  try{
    audioCtx=audioCtx||new AC();
    if(audioCtx.state==="suspended") audioCtx.resume();
    const t0=audioCtx.currentTime;
    [523.25,659.25,783.99,1046.50].forEach((f,i)=>{
      const osc=audioCtx.createOscillator(), g=audioCtx.createGain();
      osc.type=i===3?"triangle":"sine";
      osc.frequency.value=f;
      const s=t0+i*0.085;
      g.gain.setValueAtTime(0.0001,s);
      g.gain.exponentialRampToValueAtTime(0.22,s+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001,s+(i===3?0.85:0.32));
      osc.connect(g).connect(audioCtx.destination);
      osc.start(s); osc.stop(s+1.0);
    });
  }catch(e){}
}

const canvas=document.getElementById("confetti");
const ctx=canvas.getContext("2d");
let parts=[],raf=null;
function sizeCanvas(){
  const dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=innerWidth*dpr; canvas.height=innerHeight*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
sizeCanvas();
addEventListener("resize",sizeCanvas);

function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const css=getComputedStyle(document.documentElement);
  const colors=["--mark","--gold","--coral","--line"].map(v=>css.getPropertyValue(v).trim());
  for(let i=0;i<130;i++){
    parts.push({
      x:innerWidth*(0.5+(Math.random()-0.5)*0.5),
      y:innerHeight*0.42,
      vx:(Math.random()-0.5)*11,
      vy:-(6+Math.random()*11),
      w:5+Math.random()*7,h:3+Math.random()*5,
      rot:Math.random()*Math.PI,vr:(Math.random()-0.5)*0.32,
      c:colors[i%colors.length],life:0
    });
  }
  if(!raf) raf=requestAnimationFrame(tick);
}
function tick(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.y<innerHeight+40&&p.life<300);
  for(const p of parts){
    p.life++; p.vy+=0.32; p.vx*=0.995;
    p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
    ctx.save();
    ctx.translate(p.x,p.y); ctx.rotate(p.rot);
    ctx.globalAlpha=Math.max(0,1-p.life/260);
    ctx.fillStyle=p.c;
    ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    ctx.restore();
  }
  if(parts.length) raf=requestAnimationFrame(tick);
  else { ctx.clearRect(0,0,innerWidth,innerHeight); raf=null; }
}
function celebrate(){ playWin(); confetti(); }

/* ---------------- 6. Управление ---------------- */
const toast=document.getElementById("toast");
let toastTimer;
function showToast(msg){
  toast.textContent=msg;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toast.classList.remove("show"),2200);
}

document.getElementById("new").addEventListener("click",()=>{
  const u=new URL(location.href);
  u.searchParams.set("seed",Math.random().toString(36).slice(2,8));
  location.href=u.toString();
});

document.getElementById("share").addEventListener("click",async()=>{
  try{
    await navigator.clipboard.writeText(location.href);
    showToast("Ссылка скопирована — у всех будет это же поле");
  }catch(e){
    showToast("Скопируй адрес из строки браузера");
  }
});

const ICON_SOUND_ON='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const ICON_SOUND_OFF='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><line x1="22" y1="9" x2="16" y2="15"/><line x1="16" y1="9" x2="22" y2="15"/></svg>';

const soundBtn=document.getElementById("sound");
function syncSound(){
  soundBtn.setAttribute("aria-pressed",String(soundOn));
  soundBtn.setAttribute("aria-label",soundOn?"Звук включён":"Звук выключен");
  soundBtn.setAttribute("title",soundOn?"Звук включён":"Звук выключен");
  soundBtn.innerHTML=soundOn?ICON_SOUND_ON:ICON_SOUND_OFF;
}
soundBtn.addEventListener("click",()=>{
  soundOn=!soundOn;
  store.set("bingo:sound",soundOn?"on":"off");
  syncSound();
});
syncSound();

/* Сброс: снимаем все отметки, сид и само поле остаются прежними */
document.getElementById("reset").addEventListener("click",()=>{
  if(marked.size<=(FREE_CELL?1:0)){ showToast("Отмечать пока нечего"); return; }
  marked=new Set();
  if(FREE_CELL) marked.add(FREE_INDEX);
  store.set(KEY,JSON.stringify([...marked]));
  wonLines=0;
  cells.forEach(el=>el.style.removeProperty("--d"));
  render(false);
  showToast("Отметки сняты, поле то же");
});

document.getElementById("seedChip").textContent="поле "+seed;
render(false);
</script>
</body>
</html>
